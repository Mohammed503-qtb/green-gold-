# ============================================================
# ذهب أخضر — نشر تجاري كامل بأمر واحد
#   docker compose up -d --build
# الخادم: http://server-ip:3000  (ضع reverse proxy + HTTPS أمامه)
# قاعدة البيانات: حجم دائم gg-data
# ============================================================

services:
  greengold:
    build: .
    container_name: greengold-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      # - PORT=3000
    volumes:
      - gg-data:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/settings/public').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gg-data:
